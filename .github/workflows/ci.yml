name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Install package with test and tutorial extras
        run: python -m pip install ".[testing,tutorial]"

      - name: Run test suite
        run: pytest

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*

      - name: Tutorial smoke test
        run: |
          jupyter nbconvert --to notebook --execute --stdout \
            tutorial/CLING_tutorial.ipynb > /dev/null

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tooling
        run: python -m pip install ".[dev]"
      - name: Ruff
        run: ruff check src tests
